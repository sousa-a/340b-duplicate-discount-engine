# Evaluation models

version: 2

models:
  - name: eval_path1_detail
    description: >
      Per-row comparison of the Path 1 answer key against fct_path1_mfp_340b. Every planted_findings row with
      path = 1 is left-joined to the mart on mtf_icn, producing a classification: true_positive, false_negative,
      false_positive_ak, true_negative, or no_engine_row. Synthetic data.
    columns:
      - name: mtf_icn
        data_tests: [not_null, unique]
      - name: classification
        data_tests:
          - accepted_values:
              arguments:
                values: ['true_positive', 'false_negative', 'false_positive_ak', 'true_negative', 'no_engine_row']

  - name: eval_path1_scorecard
    description: >
      Aggregate evaluation metrics for Path 1, one row per scenario code plus a NO_AK_FLAG row for engine flags
      that have no answer-key entry. Reports precision, recall, F1 and the share of true duplicate dollars captured.
      Synthetic data.
