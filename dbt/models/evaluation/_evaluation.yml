# Evaluation models. These are the only models that may read from the truth schema.
# Schema: evaluation (via generate_schema_name override).

version: 2

models:
  - name: eval_path1_detail
    description: >
      Per-row comparison of the Path 1 answer key against fct_path1_mfp_340b. Every planted_findings row with
      path = 1 is left-joined to the mart on evidence_mtf_icn, producing a classification: true_positive,
      false_negative, false_positive_ak, true_negative, or no_engine_row. Synthetic data.
    columns:
      - name: finding_id
        data_tests: [not_null, unique]
      - name: evidence_mtf_icn
        data_tests: [not_null]
      - name: classification
        data_tests:
          - accepted_values:
              arguments:
                values: ['true_positive', 'false_negative', 'false_positive_ak', 'true_negative', 'no_engine_row']

  - name: eval_path1_scorecard
    description: >
      Aggregate evaluation metrics for Path 1, one row per scenario code plus a NO_AK_FLAG row for engine flags
      that have no answer-key entry. Reports precision, recall, F1 and the share of true duplicate dollars captured.
      Synthetic data.
    columns:
      - name: scenario_code
        data_tests: [not_null, unique]

  - name: eval_path2_detail
    description: >
      Per-row comparison of the Path 2 answer key against fct_path2_medicaid_340b. Every planted_findings row with
      path = 2 is left-joined to the mart on evidence_invoice_key (state|NDC|quarter|record_id), aggregated at the
      invoice line level. Classification: true_positive, false_negative, false_positive_ak, true_negative, or
      no_engine_row. Synthetic data.
    columns:
      - name: finding_id
        data_tests: [not_null, unique]
      - name: evidence_invoice_key
        data_tests: [not_null]
      - name: classification
        data_tests:
          - accepted_values:
              arguments:
                values: ['true_positive', 'false_negative', 'false_positive_ak', 'true_negative', 'no_engine_row']

  - name: eval_path2_scorecard
    description: >
      Aggregate evaluation metrics for Path 2, one row per scenario code plus a NO_AK_FLAG row for engine flags
      that have no answer-key entry. Reports precision, recall, F1 and the share of true duplicate dollars captured.
      Synthetic data.
    columns:
      - name: scenario_code
        data_tests: [not_null, unique]
